name: Check example code

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  file-list:
    name: Make File List
    runs-on: ubuntu-latest
    outputs:
      TEST_CPP_FILES: ${{ steps.GetFiles.outputs.TEST_CPP_FILES }}
      HAS_CPP: ${{ steps.GetFiles.outputs.HAS_CPP }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for changes in workflow files and runtime dependencies
        id: changed-workflow-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/test.yml
            scripts/get_files_to_test.py
            scripts/correctness_check.py
            scripts/ub-check.py
            scripts/test_utils.py
      - name: Get changed code files
        id: changed-code-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            docs/**/*.cpp
            docs/**/*.in
            docs/**/*.ans
      - name: Determine if a full test is needed
        id: changed-files
        shell: bash
        run: |
          if [[ "${{ steps.changed-workflow-files.outputs.any_changed }}" == "true" ]]; then
            echo "Full test triggered. Listing all docs files matching the glob..."
            # 用 git ls-files 列出所有被版本控制跟踪、且匹配 glob 的文件
            FILES=$(git ls-files -- 'docs/*.cpp' 'docs/**/*.cpp' 'docs/*.in' 'docs/**/*.in' 'docs/*.ans' 'docs/**/*.ans' 2>/dev/null | paste -sd ' ' -)
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            echo "all_changed_files=${FILES}" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "Partial test. Using changed code files only..."
            echo "any_changed=${{ steps.changed-code-files.outputs.any_changed }}" >> "$GITHUB_OUTPUT"
            echo "all_changed_files=${{ steps.changed-code-files.outputs.all_changed_files }}" >> "$GITHUB_OUTPUT"
            echo "mode=partial" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync
      - name: Get Files to Test
        id: GetFiles
        env:
          all_changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
        run: uv run python scripts/get_files_to_test.py

  cpp-correctness:
    name: OI-wiki C++ Offline Test
    needs: file-list
    if: ${{ needs.file-list.outputs.HAS_CPP == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync
      - name: Install C++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Correctness Check
        env:
          FILES_TO_TEST: ${{ needs.file-list.outputs.TEST_CPP_FILES }}
        run: uv run python scripts/correctness_check.py

  undefinedbehaviors-ubuntu:
    name: UB Check - x86_64 Ubuntu
    needs: [file-list, cpp-correctness]
    runs-on: ubuntu-latest
    container: ghcr.io/trickeye/ubuntu_gcc1x:clang
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install g++-9
        run: |
          apt-get update
          apt-get install -y g++-9
      - name: Undefined Behaviors Check
        env: 
          FILES_TO_TEST: ${{ needs.file-list.outputs.TEST_CPP_FILES }}
          RUNS_ON: x86_64 Ubuntu
          PYTHONIOENCODING: UTF-8
        run: python3 scripts/ub-check.py

  undefinedbehaviors-macos:
    name: UB Check - Arm64 MacOS
    needs: [file-list, cpp-correctness]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Compiler Version
        run: |
          echo "::group::Check G++ Version"
          g++-14 --version
          echo "::endgroup::"
          echo "::group::Check Clang Version"
          clang --version
          echo "::endgroup::"
      - name: Undefined Behaviors Check
        env: 
          FILES_TO_TEST: ${{ needs.file-list.outputs.TEST_CPP_FILES }}
          RUNS_ON: arm64 MacOS
          PYTHONIOENCODING: UTF-8
        run: python3 scripts/ub-check.py

  undefinedbehaviors-rv:
    name: UB Check - RISC-V Ubuntu
    needs: [file-list, cpp-correctness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Launch Risc-V Docker
        run: |
          docker pull --platform riscv64 ghcr.io/trickeye/ubtest:latest
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run -d --name ubtest --platform riscv64 \
            --volume $PWD:$PWD \
            --volume $GITHUB_STEP_SUMMARY:$GITHUB_STEP_SUMMARY \
            --workdir $PWD \
            --env FILES_TO_TEST="${{ needs.file-list.outputs.TEST_CPP_FILES }}" \
            --env RUNS_ON="riscv64 Ubuntu" \
            --env PYTHONIOENCODING="UTF-8" \
            --env GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY \
            ghcr.io/trickeye/ubtest:latest sleep infinity
          docker exec ubtest uname -a
      - name: Check Compiler Version
        run: |
          echo "::group::gcc --version"
          docker exec ubtest gcc --version
          echo "::endgroup::"
          echo "::group::g++ --version"
          docker exec ubtest g++ --version
          echo "::endgroup::"
          echo "::group::clang --version"
          docker exec ubtest clang++ --version
          echo "::endgroup::"
      - name: Undefined Behaviors Check
        # The environment variables are set in Launch Risc-V Docker step
        run: docker exec ubtest python3 scripts/ub-check.py

  undefinedbehaviors-windows:
    name: UB Check - x86_64 Windows
    needs: [file-list, cpp-correctness]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Compiler Version
        id: check-compiler-version
        shell: cmd
        run: |
          echo ::group::Install Clang, MinGW
          choco install -y llvm mingw
          echo ::endgroup::
          echo ::group::Check Clang Version
          clang --version
          echo ::endgroup::
          echo ::group::Check G++ Version
          g++ --version
          echo ::endgroup::
          echo ::group::Check MSVC Version
          REM Use vswhere to find the latest VS installation that includes VC tools
          REM See https://github.com/microsoft/vswhere/wiki/Find-VC#batch for details
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo No Visual Studio with VC tools found via vswhere.
            exit /b 1
          )
          echo Found VS at %VSINSTALL%
          >> "%GITHUB_OUTPUT%" echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl.exe
          echo ::endgroup::
      - name: Undefined Behaviors Check
        env: 
          FILES_TO_TEST: ${{ needs.file-list.outputs.TEST_CPP_FILES }}
          RUNS_ON: x86_64 Windows
          PYTHONIOENCODING: UTF-8
          VSINSTALL: ${{ steps.check-compiler-version.outputs.VSINSTALL }}
        run: |
          chcp 65001
          python scripts/ub-check.py


  undefinedbehaviors-alpine:
    name: UB Check - x86_64 Alpine
    needs: [file-list, cpp-correctness]
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Compiler Version
        run: |
          echo "::group::Install Python, GCC, Clang"
          apk add build-base python3 llvm clang
          echo "::endgroup::"
          echo "::group::Check G++ Version"
          g++ --version
          echo "::endgroup::"
          echo "::group::Check Clang Version"
          clang --version
          echo "::endgroup::"
      - name: Undefined Behaviors Check
        env: 
          FILES_TO_TEST: ${{ needs.file-list.outputs.TEST_CPP_FILES }}
          RUNS_ON: x86_64 Alpine
          PYTHONIOENCODING: UTF-8
        run: python3 scripts/ub-check.py
